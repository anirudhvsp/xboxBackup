<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xbox Media - Offline</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
        }
    
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #ffffff;
            }
        }
    
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
    
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
    
        p {
            font-size: 1.2em;
            text-align: center;
            max-width: 80%;
        }
    
        .offline-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="offline-icon">📵</div>
    <h1>You're Offline</h1>
    <p>Sorry, it looks like you're not connected to the internet. Please check your connection and try again.</p>
    <p>Xbox Media streaming requires an internet connection to function properly.</p>
</body>
</html>
